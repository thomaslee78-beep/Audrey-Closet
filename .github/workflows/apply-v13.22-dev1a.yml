name: Apply v13.22-dev1a

on:
  push:
    paths:
      - '.github/workflows/apply-v13.22-dev1a.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Shape Studio visual cleanup build
        shell: python
        run: |
          from pathlib import Path

          sw=Path('sw.js')
          text=sw.read_text()
          old="const CACHE='audrey-closet-v13.22-dev1';"
          new="const CACHE='audrey-closet-v13.22-dev1a';"
          if old not in text:
            raise SystemExit('Expected dev1 cache anchor not found')
          sw.write_text(text.replace(old,new,1))

          index=Path('index.html')
          html=index.read_text()
          html=html.replace('manifest.webmanifest?v=13.22-dev1','manifest.webmanifest?v=13.22-dev1a')
          html=html.replace('styles.css?v=13.22-dev1','styles.css?v=13.22-dev1a')
          html=html.replace('app.js?v=13.22-dev1','app.js?v=13.22-dev1a')
          html=html.replace('shape-studio-v13.22-dev1.js?v=13.22-dev1','shape-studio-v13.22-dev1.js?v=13.22-dev1a')
          html=html.replace('./sw.js?v=13.22-dev1','./sw.js?v=13.22-dev1a')
          index.write_text(html)

      - name: Commit dev1a
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git commit -m "v13.22-dev1a refine circle and oval visuals"
          git push
