name: Apply v13.21-dev6

on:
  push:
    paths:
      - '.github/workflows/apply-v13.21-dev6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact Text Studio font row
        shell: python
        run: |
          from pathlib import Path

          sw = Path('sw.js')
          text = sw.read_text()
          text = text.replace("const CACHE='audrey-closet-v13.21-dev5';", "const CACHE='audrey-closet-v13.21-dev6';", 1)

          old_js = "const fontAlignRow=document.createElement('div');fontAlignRow.className='text-font-align-row';studio.appendChild(fontAlignRow);fontAlignRow.appendChild(sel);const alignGroup=document.createElement('div');"
          new_js = "const fontAlignRow=document.createElement('div');fontAlignRow.className='text-font-align-row';studio.appendChild(fontAlignRow);const fontLabel=[...studio.children].find(el=>String(el.textContent||'').trim()==='Font');if(fontLabel){fontLabel.classList.add('text-font-inline-label');fontAlignRow.appendChild(fontLabel)}fontAlignRow.appendChild(sel);const alignGroup=document.createElement('div');"
          if old_js not in text:
            raise SystemExit('Expected dev5 font/alignment row not found')
          text = text.replace(old_js,new_js,1)

          old_css = "'.screen[data-screen=\"outfits\"] .text-font-align-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;min-width:0}',"
          new_css = "'.screen[data-screen=\"outfits\"] .text-font-align-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;min-width:0}',\n      '.screen[data-screen=\"outfits\"] .text-font-inline-label{margin:0;white-space:nowrap;align-self:center}',"
          if old_css not in text:
            raise SystemExit('Expected dev5 font/alignment CSS not found')
          text = text.replace(old_css,new_css,1)

          sw.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('manifest.webmanifest?v=13.21-dev5', 'manifest.webmanifest?v=13.21-dev6')
          html = html.replace('styles.css?v=13.21-dev5', 'styles.css?v=13.21-dev6')
          html = html.replace('app.js?v=13.21-dev5', 'app.js?v=13.21-dev6')
          html = html.replace("./sw.js?v=13.21-dev5", "./sw.js?v=13.21-dev6")
          index.write_text(html)

      - name: Commit dev6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git commit -m "v13.21-dev6 compact Text Studio font row"
          git push
