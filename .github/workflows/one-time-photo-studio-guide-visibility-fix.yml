name: One-time Photo Studio guide visibility fix

on:
  push:
    branches: [bugfix/photo-studio-postmerge-v13.23]
    paths:
      - '.github/workflows/one-time-photo-studio-guide-visibility-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bug-fix branch
        uses: actions/checkout@v4
        with:
          ref: bugfix/photo-studio-postmerge-v13.23
          fetch-depth: 0

      - name: Scope garment guide to Cutout panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('photo-studio-layout-v13.23-dev5.js')
          text=p.read_text(encoding='utf-8')

          old_css="#photoStudioDialog .studio-panel-dev5.active{display:block}"
          new_css=old_css+"\n#photoStudioDialog:not([data-studio-active-panel=\"cutout\"]) #cutoutShirtOverlay3B{display:none!important}"
          if old_css not in text:
              raise SystemExit('Panel CSS anchor missing')
          text=text.replace(old_css,new_css,1)

          old_fn="function setActive(key,resetScroll=true){if(!PANEL_IDS[key])key='cutout';activePanel=key;document.querySelectorAll('.studio-rail-btn-dev5').forEach(b=>{const on=b.dataset.studioNav===key;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false')});document.querySelectorAll('.studio-panel-dev5').forEach(p=>p.classList.toggle('active',p.dataset.studioPanel===key));const panel=document.getElementById(PANEL_IDS[key]);if(panel&&resetScroll)panel.scrollTop=0}"
          new_fn="function setActive(key,resetScroll=true){if(!PANEL_IDS[key])key='cutout';activePanel=key;const dialog=document.getElementById('photoStudioDialog');if(dialog)dialog.dataset.studioActivePanel=key;document.querySelectorAll('.studio-rail-btn-dev5').forEach(b=>{const on=b.dataset.studioNav===key;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false')});document.querySelectorAll('.studio-panel-dev5').forEach(p=>p.classList.toggle('active',p.dataset.studioPanel===key));const panel=document.getElementById(PANEL_IDS[key]);if(panel&&resetScroll)panel.scrollTop=0}"
          if old_fn not in text:
              raise SystemExit('setActive anchor missing')
          text=text.replace(old_fn,new_fn,1)
          p.write_text(text,encoding='utf-8')

          loader=Path('share-render-v13.21-dev12.js')
          boot=loader.read_text(encoding='utf-8')
          old="const PHOTO_STUDIO_LAYOUT='13.23-photo-studio-layout-dev8d';"
          new="const PHOTO_STUDIO_LAYOUT='13.23-photo-studio-layout-postmerge-bugfix1';"
          if old not in boot:
              raise SystemExit('Photo Studio cache key missing')
          boot=boot.replace(old,new,1)
          loader.write_text(boot,encoding='utf-8')
          PY

      - name: Verify fix
        shell: bash
        run: |
          node --check photo-studio-layout-v13.23-dev5.js
          node --check share-render-v13.21-dev12.js
          grep -F 'data-studio-active-panel' photo-studio-layout-v13.23-dev5.js
          grep -F '#cutoutShirtOverlay3B{display:none!important}' photo-studio-layout-v13.23-dev5.js
          grep -F "const PHOTO_STUDIO_LAYOUT='13.23-photo-studio-layout-postmerge-bugfix1';" share-render-v13.21-dev12.js

      - name: Commit fix and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-photo-studio-guide-visibility-fix.yml
          git config user.name "thomaslee78-beep"
          git config user.email "thomaslee78@gmail.com"
          git add photo-studio-layout-v13.23-dev5.js share-render-v13.21-dev12.js .github/workflows/one-time-photo-studio-guide-visibility-fix.yml
          git commit -m "Hide garment guide outside Cutout panel"
          git push origin HEAD:bugfix/photo-studio-postmerge-v13.23
