name: Deliver v13.22-dev7

on:
  push:
    paths:
      - '.github/workflows/deliver-v13.22-dev7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Shape Studio dev7 and bump PWA version
        shell: python
        run: |
          from pathlib import Path
          sw=Path('sw.js')
          s=sw.read_text()
          s=s.replace("const CACHE='audrey-closet-v13.22-dev6';", "const CACHE='audrey-closet-v13.22-dev7';", 1)
          s=s.replace("'./shape-studio-v13.22-dev6.js','./manifest.webmanifest'", "'./shape-studio-v13.22-dev6.js','./shape-studio-v13.22-dev7.js','./manifest.webmanifest'", 1)
          sw.write_text(s)

          p=Path('index.html')
          h=p.read_text()
          h=h.replace('manifest.webmanifest?v=13.22-dev6','manifest.webmanifest?v=13.22-dev7')
          h=h.replace('styles.css?v=13.22-dev6','styles.css?v=13.22-dev7')
          h=h.replace('app.js?v=13.22-dev6','app.js?v=13.22-dev7')
          h=h.replace('shape-studio-v13.22-dev1.js?v=13.22-dev6','shape-studio-v13.22-dev1.js?v=13.22-dev7')
          h=h.replace('shape-studio-v13.22-dev3.js?v=13.22-dev6','shape-studio-v13.22-dev3.js?v=13.22-dev7')
          h=h.replace('shape-studio-v13.22-dev4.js?v=13.22-dev6','shape-studio-v13.22-dev4.js?v=13.22-dev7')
          h=h.replace('shape-studio-v13.22-dev5.js?v=13.22-dev6','shape-studio-v13.22-dev5.js?v=13.22-dev7')
          h=h.replace('shape-studio-v13.22-dev6.js?v=13.22-dev6','shape-studio-v13.22-dev6.js?v=13.22-dev7')
          h=h.replace('./sw.js?v=13.22-dev6','./sw.js?v=13.22-dev7')
          marker='  <script src="shape-studio-v13.22-dev6.js?v=13.22-dev7"></script>'
          module=marker+'\n  <script src="shape-studio-v13.22-dev7.js?v=13.22-dev7"></script>'
          if 'shape-studio-v13.22-dev7.js' not in h:
              h=h.replace(marker,module,1)
          p.write_text(h)

      - name: Commit dev7 delivery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git commit -m "v13.22-dev7 deliver Shape Studio layout cleanup"
          git push
