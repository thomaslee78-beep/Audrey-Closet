name: Apply v13.22-dev1b

on:
  push:
    paths:
      - '.github/workflows/apply-v13.22-dev1b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Shape Studio SVG classes
        shell: python
        run: |
          from pathlib import Path

          shape=Path('shape-studio-v13.22-dev1.js')
          js=shape.read_text()
          js=js.replace('/* Audrey Closet v13.22-dev1a — Shape Studio basic object model + picker */','/* Audrey Closet v13.22-dev1b — Shape Studio basic object model + picker */',1)
          old='return `<svg class="shape-studio-svg shape-${safe(type)}" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">${body}</svg>`;'
          new='return `<svg class="shape-studio-svg shape-studio-type-${safe(type)}" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">${body}</svg>`;'
          if old not in js:
            raise SystemExit('Shape SVG class anchor not found')
          js=js.replace(old,new,1)
          old_css='.screen[data-screen="outfits"] .shape-picker-icon svg,.screen[data-screen="outfits"] .shape-studio-svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}'
          new_css='.screen[data-screen="outfits"] .shape-picker-icon svg,.screen[data-screen="outfits"] .shape-studio-svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none;border:0!important;background:transparent!important;border-radius:0!important}'
          if old_css not in js:
            raise SystemExit('Shape SVG CSS anchor not found')
          js=js.replace(old_css,new_css,1)
          shape.write_text(js)

          sw=Path('sw.js')
          text=sw.read_text()
          old_cache="const CACHE='audrey-closet-v13.22-dev1a';"
          new_cache="const CACHE='audrey-closet-v13.22-dev1b';"
          if old_cache not in text:
            raise SystemExit('Expected dev1a cache anchor not found')
          sw.write_text(text.replace(old_cache,new_cache,1))

          index=Path('index.html')
          html=index.read_text()
          html=html.replace('manifest.webmanifest?v=13.22-dev1a','manifest.webmanifest?v=13.22-dev1b')
          html=html.replace('styles.css?v=13.22-dev1a','styles.css?v=13.22-dev1b')
          html=html.replace('app.js?v=13.22-dev1a','app.js?v=13.22-dev1b')
          html=html.replace('shape-studio-v13.22-dev1.js?v=13.22-dev1a','shape-studio-v13.22-dev1.js?v=13.22-dev1b')
          html=html.replace('./sw.js?v=13.22-dev1a','./sw.js?v=13.22-dev1b')
          index.write_text(html)

      - name: Commit dev1b
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shape-studio-v13.22-dev1.js sw.js index.html
          git commit -m "v13.22-dev1b fix Shape Studio circle class collision"
          git push

# retrigger
