name: Create v13.21 release

on:
  push:
    paths:
      - '.github/workflows/create-v13.21-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse v13.21 >/dev/null 2>&1; then
            echo "Tag v13.21 already exists"
          else
            git tag -a v13.21 -m "Audrey Closet v13.21 stable baseline"
            git push origin v13.21
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v13.21 >/dev/null 2>&1; then
            echo "Release v13.21 already exists"
          else
            gh release create v13.21 \
              --title "Audrey Closet v13.21" \
              --notes "Stable baseline validated after restoring the full dev12 feature set and refreshing the PWA/service-worker delivery path. Includes the grouped Settings experience, S-Tier functionality, Board tools/reordering behavior, Canvas, Portfolio, Journal, Wishlist, and the existing Decorate/Text Studio implementation. Use this release as the clean rollback point before further Text Studio iterations."
          fi
