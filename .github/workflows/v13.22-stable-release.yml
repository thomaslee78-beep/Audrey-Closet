name: v13.22 stable release

on:
  push:
    paths:
      - '.github/workflows/v13.22-stable-release.yml'

permissions:
  contents: write

jobs:
  release-v1322:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote dev26 to stable v13.22
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v13.22 >/dev/null; then
            echo 'Tag v13.22 already exists; refusing to move an existing stable tag.' >&2
            exit 2
          fi

          cp shape-studio-v13.22-dev26.js shape-studio-v13.22.js
          python3 - <<'PY'
          from pathlib import Path

          p=Path('shape-studio-v13.22.js')
          s=p.read_text()
          s=s.replace('/* Audrey Closet v13.22-dev26 — lifecycle-independent Text alignment icons */','/* Audrey Closet v13.22 — stable Decorate Text + Shapes baseline */',1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          for old,new in [
            ('manifest.webmanifest?v=13.22-dev26','manifest.webmanifest?v=13.22'),
            ('styles.css?v=13.22-dev26','styles.css?v=13.22'),
            ('app.js?v=13.22-dev26','app.js?v=13.22'),
            ('shape-studio-v13.22-dev26.js?v=13.22-dev26','shape-studio-v13.22.js?v=13.22'),
            ('./sw.js?v=13.22-dev26','./sw.js?v=13.22')
          ]: s=s.replace(old,new)
          for n in ('dev1','dev3','dev4','dev5','dev6'):
              s=s.replace(f'shape-studio-v13.22-{n}.js?v=13.22-dev26',f'shape-studio-v13.22-{n}.js?v=13.22')
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace('audrey-closet-v13.22-dev26','audrey-closet-v13.22')
          s=s.replace("'./shape-studio-v13.22-dev26.js'","'./shape-studio-v13.22.js'")
          p.write_text(s)
          PY

          grep -q 'shape-studio-v13.22.js?v=13.22' index.html
          grep -q "CACHE='audrey-closet-v13.22'" sw.js
          grep -q "'./shape-studio-v13.22.js'" sw.js
          grep -q 'Audrey Closet v13.22 — stable Decorate Text + Shapes baseline' shape-studio-v13.22.js

      - name: Commit stable promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js shape-studio-v13.22.js
          git commit -m 'Release v13.22 stable Decorate Text and Shapes baseline'
          git push origin main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Tag stable commit
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v13.22 "$RELEASE_SHA" -m 'Audrey Closet v13.22 stable'
          git push origin v13.22

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v1322-notes.md <<'EOF'
          ## Audrey Closet v13.22

          Stable checkpoint for the Board → Decorate experience.

          ### Stable in this release
          - Text Studio compaction and single-screen layout improvements
          - Text add/update/clear flow
          - Font, color, style, size, and alignment controls
          - Clear left / center / right alignment icons
          - iPhone text-entry viewport restoration behavior
          - Shapes Studio compact picker and selected-shape controls
          - Basic and fun shapes, fill/border styling, border width/style, and undo-aware editing
          - Rectangle preview correction and horizontal shape picker

          ### Planned next
          - Decorate → Draw feature pass
          - Decorate → Stickers feature pass

          This tag is the rollback baseline before the next Decorate feature cycle.
          EOF
          gh release create v13.22 --title 'Audrey Closet v13.22' --notes-file /tmp/v1322-notes.md
