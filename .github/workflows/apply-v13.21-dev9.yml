name: Apply v13.21-dev9

on:
  push:
    paths:
      - '.github/workflows/apply-v13.21-dev9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact Text Studio entry and action buttons
        shell: python
        run: |
          from pathlib import Path

          sw = Path('sw.js')
          text = sw.read_text()
          text = text.replace("const CACHE='audrey-closet-v13.21-dev8';", "const CACHE='audrey-closet-v13.21-dev9';", 1)

          # Use a three-line textarea for a compact, predictable editor height.
          old_rows = "ta.rows=2;ta.placeholder='Add a title, caption or note…';"
          new_rows = "ta.rows=3;ta.placeholder='Add a title, caption or note…';"
          if old_rows not in text:
            raise SystemExit('Textarea row anchor not found')
          text = text.replace(old_rows, new_rows, 1)

          # Three equal-height actions: Add/Update, Clear/Undo, Color.
          old_stack = "'.screen[data-screen=\"outfits\"] .text-action-stack{display:grid;grid-template-rows:minmax(68px,1fr) 34px 36px;gap:6px;min-width:92px}',"
          new_stack = "'.screen[data-screen=\"outfits\"] .text-action-stack{display:grid;grid-template-rows:repeat(3,36px);gap:5px;min-width:92px;align-content:start}',"
          if old_stack not in text:
            raise SystemExit('dev8 action stack rule not found')
          text = text.replace(old_stack, new_stack, 1)

          # Override the older tall Add/Update sizing so all three controls match.
          old_action = "'.screen[data-screen=\"outfits\"] .text-entry-action-row .text-studio-action{width:92px;min-width:92px;height:auto;min-height:68px;padding:8px 7px;line-height:1.18}',"
          new_action = "'.screen[data-screen=\"outfits\"] .text-entry-action-row .text-studio-action{width:92px;min-width:92px;height:36px;min-height:36px;padding:0 7px;line-height:1.1}',"
          if old_action not in text:
            raise SystemExit('Tall Add/Update action rule not found')
          text = text.replace(old_action, new_action, 1)

          # The nested action rule also carried the old 68px minimum.
          old_nested = "'.screen[data-screen=\"outfits\"] .text-action-stack .text-studio-action{width:92px;min-width:92px;min-height:68px}',"
          new_nested = "'.screen[data-screen=\"outfits\"] .text-action-stack .text-studio-action{width:92px;min-width:92px;height:36px;min-height:36px}',"
          if old_nested not in text:
            raise SystemExit('Nested Add/Update sizing rule not found')
          text = text.replace(old_nested, new_nested, 1)

          # Match Clear to the same 36px height.
          old_clear = "'.screen[data-screen=\"outfits\"] .text-clear-btn{width:92px;height:34px;border:1px solid rgba(108,81,66,.20);border-radius:10px;background:#f8f1e3;color:#665c50;font:700 12px var(--sans);padding:0 8px}',"
          new_clear = "'.screen[data-screen=\"outfits\"] .text-clear-btn{width:92px;height:36px;border:1px solid rgba(108,81,66,.20);border-radius:10px;background:#f8f1e3;color:#665c50;font:700 12px var(--sans);padding:0 8px}',"
          if old_clear not in text:
            raise SystemExit('Clear button sizing rule not found')
          text = text.replace(old_clear, new_clear, 1)

          # Keep textarea and button column aligned as a single compact block.
          compact_anchor = "'.screen[data-screen=\"outfits\"] .text-action-stack{display:grid;grid-template-rows:repeat(3,36px);gap:5px;min-width:92px;align-content:start}',"
          compact_extra = compact_anchor + "\n      '.screen[data-screen=\"outfits\"] .text-entry-action-row{align-items:stretch}',\n      '.screen[data-screen=\"outfits\"] .text-entry-action-row #boardTextInput{height:118px;min-height:118px;max-height:118px;resize:none;box-sizing:border-box}',"
          text = text.replace(compact_anchor, compact_extra, 1)

          sw.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('manifest.webmanifest?v=13.21-dev8', 'manifest.webmanifest?v=13.21-dev9')
          html = html.replace('styles.css?v=13.21-dev8', 'styles.css?v=13.21-dev9')
          html = html.replace('app.js?v=13.21-dev8', 'app.js?v=13.21-dev9')
          html = html.replace("./sw.js?v=13.21-dev8", "./sw.js?v=13.21-dev9")
          index.write_text(html)

      - name: Commit dev9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git commit -m "v13.21-dev9 compact Text Studio action buttons"
          git push
