name: v13.22-dev22 delivery

on:
  push:
    paths:
      - '.github/workflows/v13.22-dev22-delivery.yml'

permissions:
  contents: write

jobs:
  deliver-dev22:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build dev22 iPhone-safe Text Studio compaction
        shell: bash
        run: |
          set -euo pipefail
          cp shape-studio-v13.22-dev21.js shape-studio-v13.22-dev22.js
          python3 - <<'PY'
          from pathlib import Path

          p=Path('shape-studio-v13.22-dev22.js')
          s=p.read_text()
          s=s.replace('v13.22-dev21 — compact Decorate Text Studio controls','v13.22-dev22 — compact Text Studio with iPhone viewport restore')
          s=s.replace('font-size:14px!important;line-height:1.25!important','font-size:16px!important;line-height:1.18!important')
          s=s.replace('font-size:12px!important;border-radius:9px!important','font-size:16px!important;border-radius:9px!important',1)

          anchor='''  const previousDrawBoardV132209=drawBoard;\n'''
          helper='''  function restoreOutfitBoardViewportV132222(){\n    const board=document.getElementById('outfitBoard');\n    if(!board)return;\n    requestAnimationFrame(()=>{\n      setTimeout(()=>board.scrollIntoView({behavior:'smooth',block:'start',inline:'nearest'}),260);\n    });\n  }\n\n  function installTextViewportRestoreV132222(){\n    const ta=document.getElementById('boardTextInput');\n    if(!ta||ta.dataset.viewportRestoreV132222==='true')return;\n    ta.dataset.viewportRestoreV132222='true';\n    ta.addEventListener('blur',()=>{\n      setTimeout(()=>{\n        const active=document.activeElement;\n        const studio=document.getElementById('boardTextStudioV132011');\n        if(studio&&active&&studio.contains(active))return;\n        restoreOutfitBoardViewportV132222();\n      },340);\n    });\n    document.addEventListener('click',e=>{\n      if(e.target.closest?.('#addBoardTextBtn'))restoreOutfitBoardViewportV132222();\n    },true);\n  }\n\n'''
          if anchor not in s:
              raise SystemExit('drawBoard anchor missing')
          s=s.replace(anchor,helper+anchor,1)

          install_old='''  installStylesV132207();\n  installShapeStudioLayoutV132207();\n'''
          install_new='''  installStylesV132207();\n  installShapeStudioLayoutV132207();\n  installTextViewportRestoreV132222();\n'''
          if install_old not in s:
              raise SystemExit('install anchor missing')
          s=s.replace(install_old,install_new,1)
          s=s.replace('setTimeout(installShapeStudioLayoutV132207,700);','setTimeout(installShapeStudioLayoutV132207,700);\n  setTimeout(installTextViewportRestoreV132222,200);\n  setTimeout(installTextViewportRestoreV132222,700);',1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          for old,new in [
            ('manifest.webmanifest?v=13.22-dev21','manifest.webmanifest?v=13.22-dev22'),
            ('styles.css?v=13.22-dev21','styles.css?v=13.22-dev22'),
            ('app.js?v=13.22-dev21','app.js?v=13.22-dev22'),
            ('shape-studio-v13.22-dev21.js?v=13.22-dev21','shape-studio-v13.22-dev22.js?v=13.22-dev22'),
            ('./sw.js?v=13.22-dev21','./sw.js?v=13.22-dev22')
          ]: s=s.replace(old,new)
          for n in ('dev1','dev3','dev4','dev5','dev6'):
              s=s.replace(f'shape-studio-v13.22-{n}.js?v=13.22-dev21',f'shape-studio-v13.22-{n}.js?v=13.22-dev22')
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace('audrey-closet-v13.22-dev21','audrey-closet-v13.22-dev22')
          s=s.replace("'./shape-studio-v13.22-dev21.js'","'./shape-studio-v13.22-dev22.js'")
          p.write_text(s)
          PY

          grep -q 'shape-studio-v13.22-dev22.js?v=13.22-dev22' index.html
          grep -q 'audrey-closet-v13.22-dev22' sw.js
          grep -q 'font-size:16px!important;line-height:1.18!important' shape-studio-v13.22-dev22.js
          grep -q 'restoreOutfitBoardViewportV132222' shape-studio-v13.22-dev22.js

      - name: Commit dev22
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js shape-studio-v13.22-dev22.js
          git commit -m 'v13.22-dev22 fix Text Studio iPhone zoom and viewport restore'
          git push origin main
