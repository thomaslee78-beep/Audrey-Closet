name: v13.22-dev24 delivery

on:
  push:
    paths:
      - '.github/workflows/v13.22-dev24-delivery.yml'

permissions:
  contents: write

jobs:
  deliver-dev24:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build dev24 structurally remove Text Studio info row
        shell: bash
        run: |
          set -euo pipefail
          cp shape-studio-v13.22-dev23.js shape-studio-v13.22-dev24.js
          python3 - <<'PY'
          from pathlib import Path

          p=Path('shape-studio-v13.22-dev24.js')
          s=p.read_text()
          s=s.replace('v13.22-dev23 — remove Text Studio editing info row','v13.22-dev24 — structurally remove Text Studio editing info row')

          anchor='''  function restoreOutfitBoardViewportV132222(){\n'''
          helper='''  function removeTextStudioInfoV132224(){\n    const panel=document.querySelector('.decorate-studio-panel[data-decorate-group="text"]');\n    if(!panel)return;\n    panel.querySelectorAll('#boardTextSelectionV132011,.text-studio-selection').forEach(node=>node.remove());\n  }\n\n'''
          if anchor not in s:
              raise SystemExit('viewport helper anchor missing')
          s=s.replace(anchor,helper+anchor,1)

          install_old='''  installStylesV132207();\n  installShapeStudioLayoutV132207();\n  installTextViewportRestoreV132222();\n'''
          install_new='''  installStylesV132207();\n  installShapeStudioLayoutV132207();\n  removeTextStudioInfoV132224();\n  installTextViewportRestoreV132222();\n'''
          if install_old not in s:
              raise SystemExit('install sequence missing')
          s=s.replace(install_old,install_new,1)

          tail='''  setTimeout(installTextViewportRestoreV132222,200);\n  setTimeout(installTextViewportRestoreV132222,700);\n'''
          replacement='''  setTimeout(removeTextStudioInfoV132224,0);\n  setTimeout(removeTextStudioInfoV132224,200);\n  setTimeout(removeTextStudioInfoV132224,700);\n  setTimeout(installTextViewportRestoreV132222,200);\n  setTimeout(installTextViewportRestoreV132222,700);\n'''
          if tail not in s:
              raise SystemExit('timeout anchor missing')
          s=s.replace(tail,replacement,1)

          observer_anchor='''  const shapePanelObserverV132216=new MutationObserver(()=>{\n'''
          observer='''  const textPanelObserverV132224=new MutationObserver(()=>removeTextStudioInfoV132224());\n  function observeTextPanelV132224(){\n    const panel=document.querySelector('.decorate-studio-panel[data-decorate-group="text"]');\n    if(!panel)return;\n    textPanelObserverV132224.disconnect();\n    textPanelObserverV132224.observe(panel,{childList:true,subtree:true});\n    removeTextStudioInfoV132224();\n  }\n\n'''
          if observer_anchor not in s:
              raise SystemExit('observer anchor missing')
          s=s.replace(observer_anchor,observer+observer_anchor,1)
          s=s.replace('''  removeTextStudioInfoV132224();\n  installTextViewportRestoreV132222();\n  observeShapePanelV132216();\n''','''  removeTextStudioInfoV132224();\n  installTextViewportRestoreV132222();\n  observeTextPanelV132224();\n  observeShapePanelV132216();\n''',1)
          s=s.replace('''  setTimeout(observeShapePanelV132216,200);\n  setTimeout(observeShapePanelV132216,700);\n''','''  setTimeout(observeShapePanelV132216,200);\n  setTimeout(observeShapePanelV132216,700);\n  setTimeout(observeTextPanelV132224,200);\n  setTimeout(observeTextPanelV132224,700);\n''',1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          for old,new in [
            ('manifest.webmanifest?v=13.22-dev23','manifest.webmanifest?v=13.22-dev24'),
            ('styles.css?v=13.22-dev23','styles.css?v=13.22-dev24'),
            ('app.js?v=13.22-dev23','app.js?v=13.22-dev24'),
            ('shape-studio-v13.22-dev23.js?v=13.22-dev23','shape-studio-v13.22-dev24.js?v=13.22-dev24'),
            ('./sw.js?v=13.22-dev23','./sw.js?v=13.22-dev24')
          ]: s=s.replace(old,new)
          for n in ('dev1','dev3','dev4','dev5','dev6'):
              s=s.replace(f'shape-studio-v13.22-{n}.js?v=13.22-dev23',f'shape-studio-v13.22-{n}.js?v=13.22-dev24')
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace('audrey-closet-v13.22-dev23','audrey-closet-v13.22-dev24')
          s=s.replace("'./shape-studio-v13.22-dev23.js'","'./shape-studio-v13.22-dev24.js'")
          p.write_text(s)
          PY

          grep -q 'shape-studio-v13.22-dev24.js?v=13.22-dev24' index.html
          grep -q 'audrey-closet-v13.22-dev24' sw.js
          grep -q 'removeTextStudioInfoV132224' shape-studio-v13.22-dev24.js
          grep -q 'textPanelObserverV132224' shape-studio-v13.22-dev24.js

      - name: Commit dev24
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js shape-studio-v13.22-dev24.js
          git commit -m 'v13.22-dev24 structurally remove Text Studio info row'
          git push origin main

# retrigger