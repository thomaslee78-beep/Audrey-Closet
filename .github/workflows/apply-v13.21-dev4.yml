name: Apply v13.21-dev4

on:
  push:
    paths:
      - '.github/workflows/apply-v13.21-dev4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make native color input directly tappable on iOS
        shell: python
        run: |
          from pathlib import Path

          sw = Path('sw.js')
          text = sw.read_text()
          text = text.replace("const CACHE='audrey-closet-v13.21-dev3';", "const CACHE='audrey-closet-v13.21-dev4';", 1)

          old_css = "'.screen[data-screen=\"outfits\"] .text-color-btn{width:92px;height:36px;border:1px solid rgba(108,81,66,.22);border-radius:10px;padding:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);cursor:pointer}',\n      '.screen[data-screen=\"outfits\"] #boardTextColorInputV13213{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}',"
          new_css = "'.screen[data-screen=\"outfits\"] .text-color-btn{display:none!important}',\n      '.screen[data-screen=\"outfits\"] #boardTextColorInputV13213{display:block;width:92px;height:36px;min-width:92px;border:1px solid rgba(108,81,66,.22);border-radius:10px;background:#fffaf0;padding:2px;box-sizing:border-box;cursor:pointer}',"
          if old_css not in text:
            raise SystemExit('Expected dev3 color-control CSS not found')
          text = text.replace(old_css, new_css, 1)

          old_js = "stack.appendChild(add);\n      let colorBtn=$('#boardTextColorBtnV13213');\n      let colorInput=$('#boardTextColorInputV13213');\n      if(!colorInput){colorInput=document.createElement('input');colorInput.type='color';colorInput.id='boardTextColorInputV13213';studio.appendChild(colorInput)}\n      if(!colorBtn){colorBtn=document.createElement('button');colorBtn.type='button';colorBtn.id='boardTextColorBtnV13213';colorBtn.className='text-color-btn';colorBtn.setAttribute('aria-label','Choose text color');colorBtn.title='Text color';stack.appendChild(colorBtn);colorBtn.onclick=function(e){e.preventDefault();colorInput.click()};colorInput.oninput=function(){applyTextStyleChangeV132011({color:colorInput.value},'text color')}}"
          new_js = "stack.appendChild(add);\n      let colorInput=$('#boardTextColorInputV13213');\n      if(!colorInput){colorInput=document.createElement('input');colorInput.type='color';colorInput.id='boardTextColorInputV13213';colorInput.className='text-color-input';colorInput.setAttribute('aria-label','Choose text color');colorInput.title='Text color';colorInput.value='#7d3547';stack.appendChild(colorInput);colorInput.oninput=function(){applyTextStyleChangeV132011({color:colorInput.value},'text color')}}"
          if old_js not in text:
            raise SystemExit('Expected dev3 color-control JS not found')
          text = text.replace(old_js, new_js, 1)

          sw.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('manifest.webmanifest?v=13.21-dev3', 'manifest.webmanifest?v=13.21-dev4')
          html = html.replace('styles.css?v=13.21-dev3', 'styles.css?v=13.21-dev4')
          html = html.replace('app.js?v=13.21-dev3', 'app.js?v=13.21-dev4')
          html = html.replace("./sw.js?v=13.21-dev3", "./sw.js?v=13.21-dev4")
          index.write_text(html)

      - name: Commit dev4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git commit -m "v13.21-dev4 make text color picker directly tappable"
          git push
