name: Apply v13.22-dev3

on:
  push:
    paths:
      - '.github/workflows/apply-v13.22-dev3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Shape Studio border thickness editor
        shell: python
        run: |
          from pathlib import Path

          p=Path('shape-studio-v13.22-dev1.js')
          s=p.read_text()
          s=s.replace('/* Audrey Closet v13.22-dev2 — Shape Studio independent stretch handles */','/* Audrey Closet v13.22-dev3 — Shape Studio border thickness editor */',1)

          old_norm="""    return {
      fill:typeof s.fill==='string'&&s.fill?s.fill:'rgba(77,142,138,.08)',
      borderColor:typeof s.borderColor==='string'&&s.borderColor?s.borderColor:'#4d8e8a',
      borderWidth:Math.max(0,Math.min(20,Number(s.borderWidth)||4))
    };"""
          new_norm="""    const bw=Number(s.borderWidth);
    return {
      fill:typeof s.fill==='string'&&s.fill?s.fill:'rgba(77,142,138,.08)',
      borderColor:typeof s.borderColor==='string'&&s.borderColor?s.borderColor:'#4d8e8a',
      borderWidth:Math.max(0,Math.min(20,Number.isFinite(bw)?bw:4))
    };"""
          if old_norm not in s: raise SystemExit('normalizer anchor not found')
          s=s.replace(old_norm,new_norm,1)

          old_ui='''      <div class="shape-studio-section">\n        <span class="shape-studio-label">Basic</span>\n        <div class="shape-basic-row" role="group" aria-label="Basic shapes"></div>\n      </div>\n      <p class="shape-studio-hint">Select a shape on the Board to move, rotate or resize it. Side handles stretch width or height independently.</p>`;'''
          new_ui='''      <div class="shape-studio-section">\n        <span class="shape-studio-label">Basic</span>\n        <div class="shape-basic-row" role="group" aria-label="Basic shapes"></div>\n      </div>\n      <div class="shape-edit-panel hidden" id="shapeEditPanelV132203">\n        <div class="shape-edit-head"><span>Selected Shape</span><strong id="shapeEditNameV132203">Shape</strong></div>\n        <label class="shape-border-control" for="shapeBorderWidthV132203">\n          <span>Border</span>\n          <input id="shapeBorderWidthV132203" type="range" min="0" max="12" step="1" value="4" aria-label="Shape border thickness">\n          <output id="shapeBorderValueV132203">4 px</output>\n        </label>\n      </div>\n      <p class="shape-studio-hint">Select a shape on the Board to stretch it or adjust its border.</p>`;'''
          if old_ui not in s: raise SystemExit('studio UI anchor not found')
          s=s.replace(old_ui,new_ui,1)

          bind_anchor="""    BASIC_SHAPES.forEach(def=>{
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='shape-picker-btn';
      btn.dataset.shapeType=def.id;
      btn.setAttribute('aria-label','Add '+def.label);
      btn.title=def.label;
      btn.innerHTML=`<span class=\"shape-picker-icon\">${pickerIcon(def)}</span><small>${safe(def.label==='Rounded rectangle'?'Rounded':def.label)}</small>`;
      btn.addEventListener('click',e=>{e.preventDefault();addShape(def.id)});
      row.appendChild(btn);
    });
  }
"""
          bind_new="""    BASIC_SHAPES.forEach(def=>{
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='shape-picker-btn';
      btn.dataset.shapeType=def.id;
      btn.setAttribute('aria-label','Add '+def.label);
      btn.title=def.label;
      btn.innerHTML=`<span class=\"shape-picker-icon\">${pickerIcon(def)}</span><small>${safe(def.label==='Rounded rectangle'?'Rounded':def.label)}</small>`;
      btn.addEventListener('click',e=>{e.preventDefault();addShape(def.id)});
      row.appendChild(btn);
    });
    bindShapeBorderEditorV132203();
    syncShapeEditorV132203();
  }
"""
          if bind_anchor not in s: raise SystemExit('picker binding anchor not found')
          s=s.replace(bind_anchor,bind_new,1)

          editor_block=r'''
  let shapeBorderUndoV132203=null;

  function selectedShapeV132203(){
    const model=boardItems.find(x=>String(x.uid)===String(selectedBoardUid));
    return model?.kind==='shape'?normalizeShapePiece(model):null;
  }

  function shapeLabelV132203(type){
    return BASIC_SHAPES.find(x=>x.id===type)?.label||String(type||'Shape');
  }

  function syncShapeEditorV132203(){
    const panel=document.getElementById('shapeEditPanelV132203');
    const slider=document.getElementById('shapeBorderWidthV132203');
    const output=document.getElementById('shapeBorderValueV132203');
    const name=document.getElementById('shapeEditNameV132203');
    if(!panel||!slider||!output||!name)return;
    const model=selectedShapeV132203();
    panel.classList.toggle('hidden',!model);
    if(!model)return;
    const width=Math.max(0,Math.min(12,Number(model.shapeStyle?.borderWidth) || 0));
    if(document.activeElement!==slider)slider.value=String(width);
    output.textContent=width+' px';
    name.textContent=shapeLabelV132203(model.shapeType);
  }

  function cloneShapeUndoStateV132203(){
    return boardItems.map(item=>({
      ...item,
      shapeStyle:item?.shapeStyle?{...item.shapeStyle}:item?.shapeStyle
    }));
  }

  function beginShapeBorderUndoV132203(){
    if(shapeBorderUndoV132203)return;
    shapeBorderUndoV132203={items:cloneShapeUndoStateV132203(),selectedUid:selectedBoardUid};
  }

  function finishShapeBorderUndoV132203(){
    const before=shapeBorderUndoV132203;
    shapeBorderUndoV132203=null;
    if(!before)return;
    if(typeof window.pushBoardStateUndoV13205==='function'){
      window.pushBoardStateUndoV13205(before.items,before.selectedUid,'shape border');
    }
  }

  function bindShapeBorderEditorV132203(){
    const slider=document.getElementById('shapeBorderWidthV132203');
    if(!slider||slider.dataset.boundV132203==='true')return;
    slider.dataset.boundV132203='true';
    slider.addEventListener('pointerdown',beginShapeBorderUndoV132203);
    slider.addEventListener('focus',beginShapeBorderUndoV132203);
    slider.addEventListener('input',()=>{
      const model=selectedShapeV132203();
      if(!model)return;
      const value=Math.max(0,Math.min(12,Number(slider.value)||0));
      model.shapeStyle={...normalizeShapeStyle(model.shapeStyle),borderWidth:value};
      const output=document.getElementById('shapeBorderValueV132203');
      if(output)output.textContent=value+' px';
      drawBoard();
    });
    slider.addEventListener('change',finishShapeBorderUndoV132203);
    slider.addEventListener('blur',finishShapeBorderUndoV132203);
  }

'''
          stretch_anchor='  const SHAPE_MIN_W_V132202=36;\n'
          if stretch_anchor not in s: raise SystemExit('stretch constants anchor not found')
          s=s.replace(stretch_anchor,editor_block+stretch_anchor,1)

          draw_old="""  drawBoard=function(){
    const result=originalDrawBoardV132202.apply(this,arguments);
    requestAnimationFrame(installShapeStretchHandlesV132202);
    return result;
  };

  document.addEventListener('pointerdown',e=>{
    if(e.target.closest?.('#outfitBoard .board-piece.kind-shape'))setTimeout(installShapeStretchHandlesV132202,0);
  },true);
"""
          draw_new="""  drawBoard=function(){
    const result=originalDrawBoardV132202.apply(this,arguments);
    requestAnimationFrame(installShapeStretchHandlesV132202);
    requestAnimationFrame(syncShapeEditorV132203);
    return result;
  };

  document.addEventListener('pointerdown',e=>{
    if(e.target.closest?.('#outfitBoard .board-piece.kind-shape'))setTimeout(installShapeStretchHandlesV132202,0);
    if(e.target.closest?.('#outfitBoard .board-piece')||e.target.closest?.('#outfitBoard'))setTimeout(syncShapeEditorV132203,0);
  },true);
"""
          if draw_old not in s: raise SystemExit('draw wrapper anchor not found')
          s=s.replace(draw_old,draw_new,1)

          css_anchor='      .screen[data-screen="outfits"] .shape-basic-row{display:grid;grid-template-columns:repeat(7,minmax(38px,1fr));gap:5px;align-items:stretch}\n'
          css_add=css_anchor+'''      .screen[data-screen="outfits"] .shape-edit-panel{display:grid;gap:6px;padding:8px 9px;border:1px solid rgba(108,81,66,.14);border-radius:11px;background:rgba(243,238,225,.62)}\n      .screen[data-screen="outfits"] .shape-edit-panel.hidden{display:none!important}\n      .screen[data-screen="outfits"] .shape-edit-head{display:flex;align-items:center;justify-content:space-between;gap:8px}\n      .screen[data-screen="outfits"] .shape-edit-head span{font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#817568}\n      .screen[data-screen="outfits"] .shape-edit-head strong{font-size:10px;color:#665c50}\n      .screen[data-screen="outfits"] .shape-border-control{display:grid;grid-template-columns:auto minmax(0,1fr) 34px;align-items:center;gap:7px;margin:0}\n      .screen[data-screen="outfits"] .shape-border-control>span{font-size:10px;font-weight:700;color:#665c50}\n      .screen[data-screen="outfits"] .shape-border-control input[type="range"]{width:100%;height:22px;margin:0;accent-color:var(--turq)}\n      .screen[data-screen="outfits"] .shape-border-control output{font-size:9px;font-weight:700;text-align:right;color:#817568;white-space:nowrap}\n'''
          if css_anchor not in s: raise SystemExit('CSS insertion anchor not found')
          s=s.replace(css_anchor,css_add,1)
          s=s.replace('transparent}\\n      .screen[data-screen="outfits"] .board-piece.kind-shape.selected','transparent}\n      .screen[data-screen="outfits"] .board-piece.kind-shape.selected')

          export_old='''    shapeSvgMarkup,\n    addShape,\n    installShapeStretchHandlesV132202\n'''
          export_new='''    shapeSvgMarkup,\n    addShape,\n    installShapeStretchHandlesV132202,\n    syncShapeEditorV132203\n'''
          if export_old in s: s=s.replace(export_old,export_new,1)

          p.write_text(s)

          sw=Path('sw.js')
          text=sw.read_text()
          old="const CACHE='audrey-closet-v13.22-dev2';"
          new="const CACHE='audrey-closet-v13.22-dev3';"
          if old not in text: raise SystemExit('dev2 cache anchor not found')
          sw.write_text(text.replace(old,new,1))

          index=Path('index.html')
          html=index.read_text()
          html=html.replace('manifest.webmanifest?v=13.22-dev2','manifest.webmanifest?v=13.22-dev3')
          html=html.replace('styles.css?v=13.22-dev2','styles.css?v=13.22-dev3')
          html=html.replace('app.js?v=13.22-dev2','app.js?v=13.22-dev3')
          html=html.replace('shape-studio-v13.22-dev1.js?v=13.22-dev2','shape-studio-v13.22-dev1.js?v=13.22-dev3')
          html=html.replace('./sw.js?v=13.22-dev2','./sw.js?v=13.22-dev3')
          index.write_text(html)

      - name: Commit dev3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shape-studio-v13.22-dev1.js sw.js index.html
          git commit -m "v13.22-dev3 add Shape Studio border thickness slider"
          git push

# retrigger
