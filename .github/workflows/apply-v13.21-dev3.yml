name: Apply v13.21-dev3

on:
  push:
    paths:
      - '.github/workflows/apply-v13.21-dev3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Text Studio color control
        shell: python
        run: |
          from pathlib import Path

          sw = Path('sw.js')
          text = sw.read_text()
          text = text.replace("const CACHE='audrey-closet-v13.21-dev2';", "const CACHE='audrey-closet-v13.21-dev3';", 1)

          replacements = [
            (
              "let textDraftStyleV132011={font:'script',size:'medium',bold:false,italic:false,underline:false};",
              "let textDraftStyleV132011={font:'script',size:'medium',bold:false,italic:false,underline:false,color:'#7d3547'};"
            ),
            (
              "function normalizeTextStyleV132011(style){const s=style&&typeof style==='object'?style:{};return{font:BOARD_TEXT_FONTS_V132011[s.font]?s.font:'script',size:BOARD_TEXT_SIZES_V132011[s.size]?s.size:'medium',bold:!!s.bold,italic:!!s.italic,underline:!!s.underline}}",
              "function normalizeTextStyleV132011(style){const s=style&&typeof style==='object'?style:{},color=/^#[0-9a-f]{6}$/i.test(String(s.color||''))?String(s.color).toLowerCase():'#7d3547';return{font:BOARD_TEXT_FONTS_V132011[s.font]?s.font:'script',size:BOARD_TEXT_SIZES_V132011[s.size]?s.size:'medium',bold:!!s.bold,italic:!!s.italic,underline:!!s.underline,color}}"
            ),
            (
              "function textStyleCSSV132011(style,scale=1){const s=normalizeTextStyleV132011(style),f=BOARD_TEXT_FONTS_V132011[s.font],sz=BOARD_TEXT_SIZES_V132011[s.size];return{fontFamily:f.css,fontSize:(sz.px*scale)+'px',fontWeight:String(s.bold?700:(f.weight||400)),fontStyle:s.italic?'italic':'normal',textDecoration:s.underline?'underline':'none'}}",
              "function textStyleCSSV132011(style,scale=1){const s=normalizeTextStyleV132011(style),f=BOARD_TEXT_FONTS_V132011[s.font],sz=BOARD_TEXT_SIZES_V132011[s.size];return{fontFamily:f.css,fontSize:(sz.px*scale)+'px',fontWeight:String(s.bold?700:(f.weight||400)),fontStyle:s.italic?'italic':'normal',textDecoration:s.underline?'underline':'none',color:s.color}}"
            ),
            (
              "return '<div class=\\\"board-text\\\" style=\\\"font-family:'+c.fontFamily+';font-size:'+c.fontSize+';font-weight:'+c.fontWeight+';font-style:'+c.fontStyle+';text-decoration:'+c.textDecoration+'\\\">'+esc(b.value||'')+'</div>'",
              "return '<div class=\\\"board-text\\\" style=\\\"font-family:'+c.fontFamily+';font-size:'+c.fontSize+';font-weight:'+c.fontWeight+';font-style:'+c.fontStyle+';text-decoration:'+c.textDecoration+';color:'+c.color+'\\\">'+esc(b.value||'')+'</div>'"
            ),
            (
              "Object.assign(t.style,{fontFamily:c.fontFamily,fontSize:c.fontSize,fontWeight:c.fontWeight,fontStyle:c.fontStyle,textDecoration:c.textDecoration})",
              "Object.assign(t.style,{fontFamily:c.fontFamily,fontSize:c.fontSize,fontWeight:c.fontWeight,fontStyle:c.fontStyle,textDecoration:c.textDecoration,color:c.color})"
            ),
            (
              "ctx.fillStyle='#7d3547';ctx.textAlign='center';",
              "ctx.fillStyle=s.color||'#7d3547';ctx.textAlign='center';"
            ),
            (
              "el.style.setProperty('text-decoration',css.textDecoration,'important');",
              "el.style.setProperty('text-decoration',css.textDecoration,'important');\n    el.style.setProperty('color',css.color,'important');"
            ),
          ]
          for old,new in replacements:
            if old not in text:
              raise SystemExit('Expected Text Studio source fragment not found: '+old[:100])
            text = text.replace(old,new,1)

          # Add color button styling beside the existing compact Text action layout.
          style_anchor = "'.screen[data-screen=\"outfits\"] .text-entry-action-row .text-studio-action{width:92px;min-width:92px;height:auto;min-height:68px;padding:8px 7px;line-height:1.18}',"
          style_insert = style_anchor + "\n      '.screen[data-screen=\"outfits\"] .text-action-stack{display:grid;grid-template-rows:minmax(68px,1fr) 36px;gap:7px;min-width:92px}',\n      '.screen[data-screen=\"outfits\"] .text-action-stack .text-studio-action{width:92px;min-width:92px;min-height:68px}',\n      '.screen[data-screen=\"outfits\"] .text-color-btn{width:92px;height:36px;border:1px solid rgba(108,81,66,.22);border-radius:10px;padding:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);cursor:pointer}',\n      '.screen[data-screen=\"outfits\"] #boardTextColorInputV13213{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}',"
          if style_anchor not in text:
            raise SystemExit('Text compact style anchor not found')
          text = text.replace(style_anchor, style_insert, 1)

          # Extend sync so the color button reflects selected text or the create draft.
          sync_old = "const font=$('#boardTextFontV132011');if(font)font.value=style.font;studio.querySelectorAll('.text-format-btn').forEach"
          sync_new = "const font=$('#boardTextFontV132011');if(font)font.value=style.font;const colorBtn=$('#boardTextColorBtnV13213'),colorInput=$('#boardTextColorInputV13213');if(colorBtn)colorBtn.style.background=style.color||'#7d3547';if(colorInput&&document.activeElement!==colorInput)colorInput.value=style.color||'#7d3547';studio.querySelectorAll('.text-format-btn').forEach"
          if sync_old not in text:
            raise SystemExit('Text sync anchor not found')
          text = text.replace(sync_old, sync_new, 1)

          # Convert compact action area into a two-button vertical stack.
          compact_old = "row=document.createElement('div');\n      row.className='text-entry-action-row';\n      studio.insertBefore(row,textarea);\n      row.appendChild(textarea);\n      row.appendChild(add);"
          compact_new = "row=document.createElement('div');\n      row.className='text-entry-action-row';\n      studio.insertBefore(row,textarea);\n      row.appendChild(textarea);\n      const stack=document.createElement('div');\n      stack.className='text-action-stack';\n      row.appendChild(stack);\n      stack.appendChild(add);\n      let colorBtn=$('#boardTextColorBtnV13213');\n      let colorInput=$('#boardTextColorInputV13213');\n      if(!colorInput){colorInput=document.createElement('input');colorInput.type='color';colorInput.id='boardTextColorInputV13213';studio.appendChild(colorInput)}\n      if(!colorBtn){colorBtn=document.createElement('button');colorBtn.type='button';colorBtn.id='boardTextColorBtnV13213';colorBtn.className='text-color-btn';colorBtn.setAttribute('aria-label','Choose text color');colorBtn.title='Text color';stack.appendChild(colorBtn);colorBtn.onclick=function(e){e.preventDefault();colorInput.click()};colorInput.oninput=function(){applyTextStyleChangeV132011({color:colorInput.value},'text color')}}"
          if compact_old not in text:
            raise SystemExit('Compact Text action block not found')
          text = text.replace(compact_old, compact_new, 1)

          sw.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('manifest.webmanifest?v=13.21-dev2', 'manifest.webmanifest?v=13.21-dev3')
          html = html.replace('styles.css?v=13.21-dev2', 'styles.css?v=13.21-dev3')
          html = html.replace('app.js?v=13.21-dev2', 'app.js?v=13.21-dev3')
          html = html.replace("./sw.js?v=13.21-dev2", "./sw.js?v=13.21-dev3")
          index.write_text(html)

      - name: Commit dev3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git commit -m "v13.21-dev3 add Text Studio color picker"
          git push
