name: Apply v13.21-dev1

on:
  push:
    paths:
      - '.github/workflows/apply-v13.21-dev1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply small Decorate placeholder change
        shell: python
        run: |
          from pathlib import Path

          sw = Path('sw.js')
          text = sw.read_text()
          text = text.replace("const CACHE='audrey-closet-v13.21';", "const CACHE='audrey-closet-v13.21-dev1';", 1)
          needle = "'.screen[data-screen=\"outfits\"] .board-decorate-shell .decorate-empty-note{padding:12px 10px;border:1px dashed rgba(108,81,66,.20);border-radius:14px;background:#fcf7ed;color:#7a6d60;font-size:12px;line-height:1.35}',"
          replacement = "'.screen[data-screen=\"outfits\"] .board-decorate-shell .decorate-empty-note{display:none!important}',"
          if needle not in text:
            raise SystemExit('Expected Decorate placeholder style not found')
          text = text.replace(needle, replacement, 1)
          sw.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('manifest.webmanifest?v=13.21', 'manifest.webmanifest?v=13.21-dev1')
          html = html.replace('styles.css?v=13.21', 'styles.css?v=13.21-dev1')
          html = html.replace('app.js?v=13.21', 'app.js?v=13.21-dev1')
          html = html.replace("./sw.js?v=13.21", "./sw.js?v=13.21-dev1")
          index.write_text(html)

      - name: Commit dev1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git commit -m "v13.21-dev1 hide Decorate placeholder panel"
          git push
