name: One-time font registry alignment

on:
  push:
    branches: [bugfix/photo-studio-postmerge-v13.23]
    paths:
      - '.github/workflows/one-time-font-registry-alignment.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/photo-studio-postmerge-v13.23
          fetch-depth: 0
      - name: Align shared font stacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('board-text-layout-v13.23.5.js')
          s=p.read_text()
          replacements={
            '''thin:{label:'Modern Thin',css:'\"Avenir Next\",\"Helvetica Neue\",Arial,sans-serif',weight:300}''': '''thin:{label:'Modern Thin',css:'\"Avenir Next Ultra Light\",\"Avenir Next\",\"Helvetica Neue\",Arial,sans-serif',weight:300}''',
            '''rounded:{label:'Soft Rounded',css:'\"Arial Rounded MT Bold\",\"SF Pro Rounded\",\"Trebuchet MS\",sans-serif'}''': '''rounded:{label:'Soft Rounded',css:'\"Avenir Next Rounded\",\"Trebuchet MS\",Arial,sans-serif'}''',
            '''handwritten:{label:'Pencil / Handwritten',css:'Noteworthy,\"Bradley Hand\",\"Marker Felt\",cursive'}''': '''handwritten:{label:'Pencil / Handwritten',css:'\"Bradley Hand\",\"Noteworthy\",\"Marker Felt\",cursive'}''',
            '''typewriter:{label:'Typewriter',css:'\"American Typewriter\",\"Courier New\",Courier,monospace'}''': '''typewriter:{label:'Typewriter',css:'Menlo,\"Courier New\",monospace'}'''
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'missing expected font definition: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -F "Avenir Next Ultra Light" board-text-layout-v13.23.5.js
          grep -F "Avenir Next Rounded" board-text-layout-v13.23.5.js
          grep -F "Bradley Hand" board-text-layout-v13.23.5.js
          grep -F "Menlo" board-text-layout-v13.23.5.js
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-font-registry-alignment.yml
          git config user.name "thomaslee78-beep"
          git config user.email "thomaslee78@gmail.com"
          git add board-text-layout-v13.23.5.js .github/workflows/one-time-font-registry-alignment.yml
          git commit -m "Match shared font registry to Board editor"
          git push origin HEAD:bugfix/photo-studio-postmerge-v13.23
