name: Apply v13.22-dev1

on:
  push:
    paths:
      - '.github/workflows/apply-v13.22-dev1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Shape Studio dev1
        shell: python
        run: |
          from pathlib import Path

          sw=Path('sw.js')
          text=sw.read_text()
          old="const CACHE='audrey-closet-v13.21-dev12';"
          new="const CACHE='audrey-closet-v13.22-dev1';"
          if old not in text:
            raise SystemExit('Expected stable cache anchor not found')
          text=text.replace(old,new,1)
          old_assets="const ASSETS=['./','./index.html','./styles.css','./app.js','./share-render-v13.21-dev12.js','./manifest.webmanifest','./icon-192.png','./icon-512.png'];"
          new_assets="const ASSETS=['./','./index.html','./styles.css','./app.js','./share-render-v13.21-dev12.js','./shape-studio-v13.22-dev1.js','./manifest.webmanifest','./icon-192.png','./icon-512.png'];"
          if old_assets not in text:
            raise SystemExit('Expected asset list anchor not found')
          text=text.replace(old_assets,new_assets,1)
          sw.write_text(text)

          index=Path('index.html')
          html=index.read_text()
          html=html.replace('manifest.webmanifest?v=13.21-dev12','manifest.webmanifest?v=13.22-dev1')
          html=html.replace('styles.css?v=13.21-dev12','styles.css?v=13.22-dev1')
          html=html.replace('app.js?v=13.21-dev12','app.js?v=13.22-dev1')
          html=html.replace('./sw.js?v=13.21-dev12','./sw.js?v=13.22-dev1')
          app_tag='<script src="app.js?v=13.22-dev1"></script>'
          if app_tag not in html:
            raise SystemExit('Updated app script anchor not found')
          share_tag='<script src="share-render-v13.21-dev12.js?v=13.21-dev12"></script>'
          if share_tag not in html:
            raise SystemExit('Share renderer anchor not found')
          shape_tag=share_tag+'\n  <script src="shape-studio-v13.22-dev1.js?v=13.22-dev1"></script>'
          html=html.replace(share_tag,shape_tag,1)
          index.write_text(html)

      - name: Commit dev1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git commit -m "v13.22-dev1 wire Shape Studio basic picker"
          git push

