name: v13.22-dev14 delivery

on:
  push:
    paths:
      - '.github/workflows/v13.22-dev14-delivery.yml'

permissions:
  contents: write

jobs:
  deliver-dev14:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build dev14 Selected Shape layout
        shell: bash
        run: |
          set -euo pipefail
          cp shape-studio-v13.22-dev13.js shape-studio-v13.22-dev14.js
          python3 - <<'PY'
          from pathlib import Path

          p=Path('shape-studio-v13.22-dev14.js')
          s=p.read_text()
          s=s.replace('v13.22-dev13 — compact Decorate tabs + Shape Studio refinements','v13.22-dev14 — compact Selected Shape style row')
          needle='''      .screen[data-screen="outfits"] #shapeStudioV132201{gap:5px!important;margin-top:2px!important}\n\n      @media(max-width:410px){'''
          insert='''      .screen[data-screen="outfits"] #shapeStudioV132201{gap:5px!important;margin-top:2px!important}\n\n      /* dev14: compact Selected Shape styling controls into one row. */\n      .screen[data-screen="outfits"] #shapeEditPanelV132203{gap:4px!important;padding:6px 8px!important}\n      .screen[data-screen="outfits"] #shapeEditPanelV132203 .shape-edit-head{min-height:16px}\n      .screen[data-screen="outfits"] #shapeEditPanelV132203 .shape-border-control{gap:5px!important}\n      .screen[data-screen="outfits"] #shapeStyleControlsV132206{display:grid!important;grid-template-columns:minmax(0,.9fr) minmax(0,.9fr) minmax(0,1.4fr);gap:5px!important;padding-top:0!important;align-items:stretch}\n      .screen[data-screen="outfits"] #shapeStyleControlsV132206.hidden{display:none!important}\n      .screen[data-screen="outfits"] #shapeStyleControlsV132206 .shape-color-row{display:contents!important}\n      .screen[data-screen="outfits"] #shapeStyleControlsV132206 .shape-color-control{min-width:0;min-height:30px!important;padding:3px 5px!important;gap:4px!important}\n      .screen[data-screen="outfits"] #shapeStyleControlsV132206 .shape-color-control span{font-size:8px!important}\n      .screen[data-screen="outfits"] #shapeStyleControlsV132206 .shape-color-control input[type="color"]{width:28px!important;height:22px!important}\n      .screen[data-screen="outfits"] #shapeStyleControlsV132206 .shape-border-style-row{display:grid!important;grid-template-columns:auto minmax(0,1fr);gap:4px!important;align-items:center;min-width:0}\n      .screen[data-screen="outfits"] #shapeStyleControlsV132206 .shape-border-style-row>span{font-size:8px!important}\n      .screen[data-screen="outfits"] #shapeStyleControlsV132206 .shape-border-style-options{grid-template-columns:1fr 1fr!important;gap:3px!important;min-width:0}\n      .screen[data-screen="outfits"] #shapeStyleControlsV132206 .shape-border-style-btn{min-width:0;min-height:30px!important;padding:3px 4px!important;gap:3px!important;font-size:8px!important}\n      .screen[data-screen="outfits"] #shapeStyleControlsV132206 .shape-border-style-btn i{width:16px!important}\n\n      @media(max-width:410px){'''
          if needle not in s:
              raise SystemExit('dev14 insertion point not found')
          s=s.replace(needle,insert)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('manifest.webmanifest?v=13.22-dev13','manifest.webmanifest?v=13.22-dev14')
          s=s.replace('styles.css?v=13.22-dev13','styles.css?v=13.22-dev14')
          s=s.replace('app.js?v=13.22-dev13','app.js?v=13.22-dev14')
          for n in ('dev1','dev3','dev4','dev5','dev6'):
              s=s.replace(f'shape-studio-v13.22-{n}.js?v=13.22-dev13',f'shape-studio-v13.22-{n}.js?v=13.22-dev14')
          s=s.replace('shape-studio-v13.22-dev13.js?v=13.22-dev13','shape-studio-v13.22-dev14.js?v=13.22-dev14')
          s=s.replace('./sw.js?v=13.22-dev13','./sw.js?v=13.22-dev14')
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace('audrey-closet-v13.22-dev13','audrey-closet-v13.22-dev14')
          s=s.replace("'./shape-studio-v13.22-dev13.js'","'./shape-studio-v13.22-dev14.js'")
          p.write_text(s)
          PY

          grep -q 'shape-studio-v13.22-dev14.js?v=13.22-dev14' index.html
          grep -q 'audrey-closet-v13.22-dev14' sw.js
          grep -q 'shapeStyleControlsV132206{display:grid!important;grid-template-columns' shape-studio-v13.22-dev14.js

      - name: Commit dev14
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js shape-studio-v13.22-dev14.js
          git commit -m 'v13.22-dev14 compact Selected Shape style controls'
          git push origin main
