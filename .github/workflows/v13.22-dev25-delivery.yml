name: v13.22-dev25 delivery

on:
  push:
    paths:
      - '.github/workflows/v13.22-dev25-delivery.yml'

permissions:
  contents: write

jobs:
  deliver-dev25:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build dev25 clearer text alignment icons
        shell: bash
        run: |
          set -euo pipefail
          cp shape-studio-v13.22-dev24.js shape-studio-v13.22-dev25.js
          python3 - <<'PY'
          from pathlib import Path

          p=Path('shape-studio-v13.22-dev25.js')
          s=p.read_text()
          s=s.replace('v13.22-dev24 — structurally remove Text Studio editing info row','v13.22-dev25 — clearer Text Studio alignment icons')

          anchor='''  function removeTextStudioInfoV132224(){\n'''
          helper='''  function updateTextAlignIconsV132225(){\n    const studio=document.getElementById('boardTextStudioV132011');\n    if(!studio)return;\n    studio.querySelectorAll('.text-align-btn').forEach(btn=>{\n      const align=btn.dataset.textAlign;\n      if(!['left','center','right'].includes(align))return;\n      if(btn.dataset.alignIconV132225==='true')return;\n      btn.dataset.alignIconV132225='true';\n      btn.innerHTML='<span class="text-align-icon-v132225 text-align-icon-'+align+'" aria-hidden="true"><i></i><i></i><i></i></span>';\n    });\n  }\n\n'''
          if anchor not in s:
              raise SystemExit('text helper anchor missing')
          s=s.replace(anchor,helper+anchor,1)

          css_anchor='''      /* dev23: remove selected-text informational row to keep Text Studio single-screen compact. */\n'''
          css='''      /* dev25: explicit three-line alignment glyphs. */\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] .text-align-icon-v132225{display:flex!important;flex-direction:column;justify-content:center;gap:2px;width:17px!important;height:15px!important;transform:none!important;overflow:visible!important}\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] .text-align-icon-v132225 i{display:block;height:2px;border-radius:2px;background:currentColor;flex:0 0 auto}\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] .text-align-icon-v132225 i:nth-child(1){width:17px}\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] .text-align-icon-v132225 i:nth-child(2){width:11px}\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] .text-align-icon-v132225 i:nth-child(3){width:14px}\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] .text-align-icon-left{align-items:flex-start}\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] .text-align-icon-center{align-items:center}\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] .text-align-icon-right{align-items:flex-end}\n\n'''
          if css_anchor not in s:
              raise SystemExit('css anchor missing')
          s=s.replace(css_anchor,css+css_anchor,1)

          s=s.replace('''  const textPanelObserverV132224=new MutationObserver(()=>removeTextStudioInfoV132224());\n''','''  const textPanelObserverV132224=new MutationObserver(()=>{removeTextStudioInfoV132224();updateTextAlignIconsV132225()});\n''',1)
          s=s.replace('''    removeTextStudioInfoV132224();\n  }\n\n  const shapePanelObserverV132216''','''    removeTextStudioInfoV132224();\n    updateTextAlignIconsV132225();\n  }\n\n  const shapePanelObserverV132216''',1)
          s=s.replace('''  removeTextStudioInfoV132224();\n  installTextViewportRestoreV132222();\n''','''  removeTextStudioInfoV132224();\n  updateTextAlignIconsV132225();\n  installTextViewportRestoreV132222();\n''',1)
          s=s.replace('''  setTimeout(removeTextStudioInfoV132224,700);\n  setTimeout(installTextViewportRestoreV132222,200);\n''','''  setTimeout(removeTextStudioInfoV132224,700);\n  setTimeout(updateTextAlignIconsV132225,0);\n  setTimeout(updateTextAlignIconsV132225,200);\n  setTimeout(updateTextAlignIconsV132225,700);\n  setTimeout(installTextViewportRestoreV132222,200);\n''',1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          for old,new in [
            ('manifest.webmanifest?v=13.22-dev24','manifest.webmanifest?v=13.22-dev25'),
            ('styles.css?v=13.22-dev24','styles.css?v=13.22-dev25'),
            ('app.js?v=13.22-dev24','app.js?v=13.22-dev25'),
            ('shape-studio-v13.22-dev24.js?v=13.22-dev24','shape-studio-v13.22-dev25.js?v=13.22-dev25'),
            ('./sw.js?v=13.22-dev24','./sw.js?v=13.22-dev25')
          ]: s=s.replace(old,new)
          for n in ('dev1','dev3','dev4','dev5','dev6'):
              s=s.replace(f'shape-studio-v13.22-{n}.js?v=13.22-dev24',f'shape-studio-v13.22-{n}.js?v=13.22-dev25')
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace('audrey-closet-v13.22-dev24','audrey-closet-v13.22-dev25')
          s=s.replace("'./shape-studio-v13.22-dev24.js'","'./shape-studio-v13.22-dev25.js'")
          p.write_text(s)
          PY

          grep -q 'shape-studio-v13.22-dev25.js?v=13.22-dev25' index.html
          grep -q 'audrey-closet-v13.22-dev25' sw.js
          grep -q 'updateTextAlignIconsV132225' shape-studio-v13.22-dev25.js
          grep -q 'text-align-icon-right' shape-studio-v13.22-dev25.js

      - name: Commit dev25
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js shape-studio-v13.22-dev25.js
          git commit -m 'v13.22-dev25 clarify Text Studio alignment icons'
          git push origin main

# retrigger
