name: Apply v13.21-dev2

on:
  push:
    paths:
      - '.github/workflows/apply-v13.21-dev2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide emptied legacy Decorate container
        shell: python
        run: |
          from pathlib import Path

          sw = Path('sw.js')
          text = sw.read_text()
          text = text.replace("const CACHE='audrey-closet-v13.21-dev1';", "const CACHE='audrey-closet-v13.21-dev2';", 1)

          old1 = "'.screen[data-screen=\"outfits\"] .board-decorate-shell #creativeTools{display:grid!important}',"
          old2 = "'.screen[data-screen=\"outfits\"] .board-decorate-shell #creativeTools.hidden{display:grid!important}',"
          new1 = "'.screen[data-screen=\"outfits\"] .board-decorate-shell #creativeTools{display:none!important}',"
          new2 = "'.screen[data-screen=\"outfits\"] .board-decorate-shell #creativeTools.hidden{display:none!important}',"

          if old1 not in text or old2 not in text:
            raise SystemExit('Expected legacy creativeTools visibility rules not found')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          sw.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('manifest.webmanifest?v=13.21-dev1', 'manifest.webmanifest?v=13.21-dev2')
          html = html.replace('styles.css?v=13.21-dev1', 'styles.css?v=13.21-dev2')
          html = html.replace('app.js?v=13.21-dev1', 'app.js?v=13.21-dev2')
          html = html.replace("./sw.js?v=13.21-dev1", "./sw.js?v=13.21-dev2")
          index.write_text(html)

      - name: Commit dev2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git commit -m "v13.21-dev2 hide legacy Decorate container"
          git push
