name: v13.22-dev26 delivery

on:
  push:
    paths:
      - '.github/workflows/v13.22-dev26-delivery.yml'

permissions:
  contents: write

jobs:
  deliver-dev26:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build dev26 lifecycle-independent alignment icons
        shell: bash
        run: |
          set -euo pipefail
          cp shape-studio-v13.22-dev25.js shape-studio-v13.22-dev26.js
          python3 - <<'PY'
          from pathlib import Path

          p=Path('shape-studio-v13.22-dev26.js')
          s=p.read_text()
          s=s.replace('v13.22-dev25 — clearer Text Studio alignment icons','v13.22-dev26 — lifecycle-independent Text alignment icons')

          css_anchor='''      /* dev25: explicit three-line alignment glyphs. */\n'''
          css='''      /* dev26: render alignment glyphs directly on the existing button span so creation timing does not matter. */\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] .text-align-btn>span{\n        display:block!important;width:18px!important;height:14px!important;font-size:0!important;line-height:0!important;overflow:visible!important;transform:none!important;\n        background-image:linear-gradient(currentColor,currentColor),linear-gradient(currentColor,currentColor),linear-gradient(currentColor,currentColor)!important;\n        background-repeat:no-repeat!important;\n        background-size:18px 2px,11px 2px,14px 2px!important\n      }\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] .text-align-left>span{background-position:left 1px,left 6px,left 11px!important}\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] .text-align-center>span{background-position:center 1px,center 6px,center 11px!important}\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] .text-align-right>span{background-position:right 1px,right 6px,right 11px!important}\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] .text-align-btn>span>i{display:none!important}\n\n'''
          if css_anchor not in s:
              raise SystemExit('dev25 CSS anchor missing')
          s=s.replace(css_anchor,css+css_anchor,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          for old,new in [
            ('manifest.webmanifest?v=13.22-dev25','manifest.webmanifest?v=13.22-dev26'),
            ('styles.css?v=13.22-dev25','styles.css?v=13.22-dev26'),
            ('app.js?v=13.22-dev25','app.js?v=13.22-dev26'),
            ('shape-studio-v13.22-dev25.js?v=13.22-dev25','shape-studio-v13.22-dev26.js?v=13.22-dev26'),
            ('./sw.js?v=13.22-dev25','./sw.js?v=13.22-dev26')
          ]: s=s.replace(old,new)
          for n in ('dev1','dev3','dev4','dev5','dev6'):
              s=s.replace(f'shape-studio-v13.22-{n}.js?v=13.22-dev25',f'shape-studio-v13.22-{n}.js?v=13.22-dev26')
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace('audrey-closet-v13.22-dev25','audrey-closet-v13.22-dev26')
          s=s.replace("'./shape-studio-v13.22-dev25.js'","'./shape-studio-v13.22-dev26.js'")
          p.write_text(s)
          PY

          grep -q 'shape-studio-v13.22-dev26.js?v=13.22-dev26' index.html
          grep -q 'audrey-closet-v13.22-dev26' sw.js
          grep -q 'background-position:left 1px,left 6px,left 11px' shape-studio-v13.22-dev26.js
          grep -q 'background-position:right 1px,right 6px,right 11px' shape-studio-v13.22-dev26.js

      - name: Commit dev26
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js shape-studio-v13.22-dev26.js
          git commit -m 'v13.22-dev26 make Text alignment icons lifecycle independent'
          git push origin main
