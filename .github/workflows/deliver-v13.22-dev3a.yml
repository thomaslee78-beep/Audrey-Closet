name: Deliver v13.22-dev3a

on:
  push:
    paths:
      - '.github/workflows/deliver-v13.22-dev3a.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump PWA version to dev3a
        run: |
          python - <<'PY'
          from pathlib import Path
          sw=Path('sw.js')
          s=sw.read_text()
          s=s.replace("const CACHE='audrey-closet-v13.22-dev3';", "const CACHE='audrey-closet-v13.22-dev3a';", 1)
          sw.write_text(s)

          p=Path('index.html')
          h=p.read_text()
          h=h.replace('manifest.webmanifest?v=13.22-dev3','manifest.webmanifest?v=13.22-dev3a')
          h=h.replace('styles.css?v=13.22-dev3','styles.css?v=13.22-dev3a')
          h=h.replace('app.js?v=13.22-dev3','app.js?v=13.22-dev3a')
          h=h.replace('shape-studio-v13.22-dev1.js?v=13.22-dev3','shape-studio-v13.22-dev1.js?v=13.22-dev3a')
          h=h.replace('shape-studio-v13.22-dev3.js?v=13.22-dev3','shape-studio-v13.22-dev3.js?v=13.22-dev3a')
          h=h.replace('./sw.js?v=13.22-dev3','./sw.js?v=13.22-dev3a')
          p.write_text(h)
          PY
      - name: Commit dev3a delivery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git commit -m "v13.22-dev3a bump PWA delivery"
          git push
