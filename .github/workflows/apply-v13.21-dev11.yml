name: Apply v13.21-dev11

on:
  push:
    paths:
      - '.github/workflows/apply-v13.21-dev11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Portfolio and Share text rendering
        shell: python
        run: |
          from pathlib import Path

          sw = Path('sw.js')
          text = sw.read_text()
          text = text.replace("const CACHE='audrey-closet-v13.21-dev10';", "const CACHE='audrey-closet-v13.21-dev11';", 1)

          # Canvas uses a slightly stricter family string than DOM CSS so iOS
          # does not drop the entire font declaration when one local family is unavailable.
          old_canvas = "function canvasFontV132011(style,px){const s=normalizeTextStyleV132011(style),f=BOARD_TEXT_FONTS_V132011[s.font];return (s.italic?'italic ':'')+(s.bold?700:(f.weight||400))+' '+Math.max(7,px)+'px '+f.css}"
          new_canvas = "function canvasFontV132011(style,px){const s=normalizeTextStyleV132011(style),f=BOARD_TEXT_FONTS_V132011[s.font],families={script:'\\\"Snell Roundhand\\\",\\\"Segoe Script\\\",cursive',editorial:'\\\"Iowan Old Style\\\",Palatino,Georgia,serif',classic:'Georgia,\\\"Times New Roman\\\",serif',modern:'\\\"Avenir Next\\\",\\\"Helvetica Neue\\\",Arial,sans-serif',clean:'system-ui,\\\"Segoe UI\\\",Arial,sans-serif',thin:'\\\"Avenir Next\\\",\\\"Helvetica Neue\\\",Arial,sans-serif',rounded:'\\\"Avenir Next Rounded\\\",\\\"Trebuchet MS\\\",Arial,sans-serif',handwritten:'\\\"Bradley Hand\\\",Noteworthy,\\\"Marker Felt\\\",cursive',typewriter:'Menlo,\\\"Courier New\\\",monospace',fun:'\\\"Chalkboard SE\\\",\\\"Marker Felt\\\",\\\"Comic Sans MS\\\",cursive'};return (s.italic?'italic ':'')+(s.bold?700:(f.weight||400))+' '+Math.max(7,px)+'px '+(families[s.font]||f.css)}"
          if old_canvas not in text:
            raise SystemExit('Canvas font resolver anchor not found')
          text = text.replace(old_canvas, new_canvas, 1)

          # Portfolio thumbnail cards previously ignored textStyle entirely.
          # Override only the text branch and preserve every non-text mini renderer.
          anchor = "window.__audreyDrawBoardTextV132011=drawBoardTextToContextV132011;"
          portfolio_patch = r'''
  const originalRenderMiniPieceV132111=renderMiniPiece;
  renderMiniPiece=function(p,o){
    if(p?.kind!=='text')return originalRenderMiniPieceV132111.apply(this,arguments);
    p=normalizeTextPieceV132011({...p});
    const sw=Number(o?.boardWidth)||390,sh=Number(o?.boardHeight)||420;
    const left=Math.max(-10,Math.min(100,(p.x/sw)*100));
    const top=Math.max(-10,Math.min(100,(p.y/sh)*100));
    const width=Math.max(8,Math.min(70,(p.w/sw)*100));
    const height=Math.max(8,Math.min(70,(p.h/sh)*100));
    const c=textStyleCSSV132011(p.textStyle,.38);
    const style=[
      'left:'+left+'%','top:'+top+'%','width:'+width+'%','height:'+height+'%',
      'z-index:'+(p.z||1),'transform:rotate('+(p.rotation||0)+'deg)',
      'font-family:'+c.fontFamily,'font-size:'+c.fontSize,'font-weight:'+c.fontWeight,
      'font-style:'+c.fontStyle,'text-decoration:'+c.textDecoration,'color:'+c.color,
      'text-align:'+c.textAlign,'display:flex','align-items:center','justify-content:'+c.justifyContent,
      'white-space:pre-wrap','line-height:1.08','overflow:hidden'
    ].join(';');
    return '<span class="portfolio-deco mini-deco" style="'+style+'">'+esc(p.value||'')+'</span>';
  };

  function refreshPortfolioTextStylesV132111(root=document){
    if(!root?.querySelectorAll)return;
    root.querySelectorAll('.snapshot-piece.kind-text').forEach(function(piece){
      const node=piece.querySelector('.board-text');
      if(!node)return;
      // Snapshot text is already styled by renderSnapshotPiece; force a reflow
      // after modal/card insertion so iOS applies local font fallbacks consistently.
      const family=node.style.fontFamily;
      if(family){node.style.fontFamily='';void node.offsetWidth;node.style.fontFamily=family}
    });
  }

  const originalRenderSavedOutfitsV132111=renderSavedOutfits;
  renderSavedOutfits=function(){
    const result=originalRenderSavedOutfitsV132111.apply(this,arguments);
    requestAnimationFrame(function(){refreshPortfolioTextStylesV132111($('#savedOutfits'))});
    return result;
  };

  const originalViewOutfitV132111=viewOutfit;
  viewOutfit=function(oid){
    const result=originalViewOutfitV132111.apply(this,arguments);
    requestAnimationFrame(function(){refreshPortfolioTextStylesV132111($('#outfitViewDialog'))});
    return result;
  };
'''
          if anchor not in text:
            raise SystemExit('Text renderer export anchor not found')
          text = text.replace(anchor, anchor + portfolio_patch, 1)

          sw.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('manifest.webmanifest?v=13.21-dev10', 'manifest.webmanifest?v=13.21-dev11')
          html = html.replace('styles.css?v=13.21-dev10', 'styles.css?v=13.21-dev11')
          html = html.replace('app.js?v=13.21-dev10', 'app.js?v=13.21-dev11')
          html = html.replace("./sw.js?v=13.21-dev10", "./sw.js?v=13.21-dev11")
          index.write_text(html)

      - name: Commit dev11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git commit -m "v13.21-dev11 align Portfolio and Share text rendering"
          git push
