name: v13.22-dev19 delivery

on:
  push:
    paths:
      - '.github/workflows/v13.22-dev19-delivery.yml'

permissions:
  contents: write

jobs:
  deliver-dev19:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build dev19 rectangle picker icon refinement
        shell: bash
        run: |
          set -euo pipefail
          cp shape-studio-v13.22-dev18.js shape-studio-v13.22-dev19.js
          python3 - <<'PY'
          from pathlib import Path

          p=Path('shape-studio-v13.22-dev19.js')
          s=p.read_text()
          s=s.replace('v13.22-dev18 — hard single-row horizontal Shapes picker','v13.22-dev19 — clearer Rectangle picker icon')

          anchor='''      .screen[data-screen="outfits"] #shapePickerStripV132217 .shape-picker-icon{max-width:30px;max-height:30px}\n      .screen[data-screen="outfits"] #shapePickerStripV132217 .shape-picker-btn small{font-size:7px!important}\n'''
          replacement='''      .screen[data-screen="outfits"] #shapePickerStripV132217 .shape-picker-icon{max-width:30px;max-height:30px}\n      .screen[data-screen="outfits"] #shapePickerStripV132217>.shape-picker-btn[data-shape-type="rectangle"] .shape-picker-icon{width:40px!important;height:22px!important;max-width:40px!important;max-height:22px!important}\n      .screen[data-screen="outfits"] #shapePickerStripV132217>.shape-picker-btn[data-shape-type="rectangle"] .shape-picker-icon svg{width:40px!important;height:22px!important}\n      .screen[data-screen="outfits"] #shapePickerStripV132217 .shape-picker-btn small{font-size:7px!important}\n'''
          if anchor not in s:
              raise SystemExit('rectangle icon CSS anchor not found')
          s=s.replace(anchor,replacement,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('manifest.webmanifest?v=13.22-dev18','manifest.webmanifest?v=13.22-dev19')
          s=s.replace('styles.css?v=13.22-dev18','styles.css?v=13.22-dev19')
          s=s.replace('app.js?v=13.22-dev18','app.js?v=13.22-dev19')
          for n in ('dev1','dev3','dev4','dev5','dev6'):
              s=s.replace(f'shape-studio-v13.22-{n}.js?v=13.22-dev18',f'shape-studio-v13.22-{n}.js?v=13.22-dev19')
          s=s.replace('shape-studio-v13.22-dev18.js?v=13.22-dev18','shape-studio-v13.22-dev19.js?v=13.22-dev19')
          s=s.replace('./sw.js?v=13.22-dev18','./sw.js?v=13.22-dev19')
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace('audrey-closet-v13.22-dev18','audrey-closet-v13.22-dev19')
          s=s.replace("'./shape-studio-v13.22-dev18.js'","'./shape-studio-v13.22-dev19.js'")
          p.write_text(s)
          PY

          grep -q 'shape-studio-v13.22-dev19.js?v=13.22-dev19' index.html
          grep -q 'audrey-closet-v13.22-dev19' sw.js
          grep -q 'data-shape-type="rectangle"' shape-studio-v13.22-dev19.js

      - name: Commit dev19
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js shape-studio-v13.22-dev19.js
          git commit -m 'v13.22-dev19 clarify Rectangle picker icon'
          git push origin main
