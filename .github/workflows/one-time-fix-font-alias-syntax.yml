name: One-time font alias syntax correction

on:
  push:
    branches: [bugfix/photo-studio-postmerge-v13.23]
    paths:
      - '.github/workflows/one-time-fix-font-alias-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/photo-studio-postmerge-v13.23
      - name: Fix and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('board-text-layout-v13.23.5.js')
          s=p.read_text()
          bad="mono:'typewriter\n"
          good="mono:'typewriter'\n"
          if bad not in s: raise SystemExit('Expected syntax typo not found')
          p.write_text(s.replace(bad,good,1))
          PY
          node --check board-text-layout-v13.23.5.js
          node --check photo-studio-layout-v13.23-dev5.js
          node --check share-render-v13.21-dev12.js
      - name: Commit correction
        run: |
          rm .github/workflows/one-time-fix-font-alias-syntax.yml
          git config user.name "thomaslee78-beep"
          git config user.email "thomaslee78@gmail.com"
          git add board-text-layout-v13.23.5.js .github/workflows/one-time-fix-font-alias-syntax.yml
          git commit -m "Fix font alias registry syntax"
          git push origin HEAD:bugfix/photo-studio-postmerge-v13.23
