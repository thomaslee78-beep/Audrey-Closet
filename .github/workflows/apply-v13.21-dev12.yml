name: Apply v13.21-dev12

on:
  push:
    paths:
      - '.github/workflows/apply-v13.21-dev12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire flattened saved-look Share renderer
        shell: python
        run: |
          from pathlib import Path

          share = Path('share-render-v13.21-dev12.js')
          js = share.read_text()
          if "ctxMeasure=document.createElement('canvas').getContext('2d');" not in js:
            raise SystemExit('Share measurement anchor not found')
          js = js.replace("ctxMeasure=document.createElement('canvas').getContext('2d');", "const ctxMeasure=document.createElement('canvas').getContext('2d');", 1)
          share.write_text(js)

          sw = Path('sw.js')
          text = sw.read_text()
          old_cache = "const CACHE='audrey-closet-v13.21-dev10';"
          new_cache = "const CACHE='audrey-closet-v13.21-dev12';"
          if old_cache not in text:
            raise SystemExit('Expected dev10 cache anchor not found')
          text = text.replace(old_cache, new_cache, 1)
          old_assets = "const ASSETS=['./','./index.html','./styles.css','./app.js','./manifest.webmanifest','./icon-192.png','./icon-512.png'];"
          new_assets = "const ASSETS=['./','./index.html','./styles.css','./app.js','./share-render-v13.21-dev12.js','./manifest.webmanifest','./icon-192.png','./icon-512.png'];"
          if old_assets not in text:
            raise SystemExit('Service worker assets anchor not found')
          text = text.replace(old_assets, new_assets, 1)
          sw.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('manifest.webmanifest?v=13.21-dev10', 'manifest.webmanifest?v=13.21-dev12')
          html = html.replace('styles.css?v=13.21-dev10', 'styles.css?v=13.21-dev12')
          html = html.replace('app.js?v=13.21-dev10', 'app.js?v=13.21-dev12')
          html = html.replace("./sw.js?v=13.21-dev10", "./sw.js?v=13.21-dev12")
          app_tag = '<script src="app.js?v=13.21-dev12"></script>'
          share_tag = app_tag + '\n  <script src="share-render-v13.21-dev12.js?v=13.21-dev12"></script>'
          if app_tag not in html:
            raise SystemExit('Updated app script anchor not found')
          html = html.replace(app_tag, share_tag, 1)
          index.write_text(html)

      - name: Commit dev12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html share-render-v13.21-dev12.js
          git commit -m "v13.21-dev12 flatten saved Board before Share"
          git push
