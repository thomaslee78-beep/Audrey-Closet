name: v13.22-dev23 delivery

on:
  push:
    paths:
      - '.github/workflows/v13.22-dev23-delivery.yml'

permissions:
  contents: write

jobs:
  deliver-dev23:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build dev23 remove Text Studio info message
        shell: bash
        run: |
          set -euo pipefail
          cp shape-studio-v13.22-dev22.js shape-studio-v13.22-dev23.js
          python3 - <<'PY'
          from pathlib import Path

          p=Path('shape-studio-v13.22-dev23.js')
          s=p.read_text()
          s=s.replace('v13.22-dev22 — compact Text Studio with iPhone viewport restore','v13.22-dev23 — remove Text Studio editing info row')

          anchor='''      /* dev21: compact Text Studio vertically without changing handlers or structure. */\n'''
          css='''      /* dev23: remove selected-text informational row to keep Text Studio single-screen compact. */\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] #boardTextSelectionV132011,\n      .screen[data-screen="outfits"] .decorate-studio-panel[data-decorate-group="text"] .text-studio-selection{display:none!important;margin:0!important;padding:0!important;height:0!important;min-height:0!important;border:0!important;overflow:hidden!important}\n\n'''
          if anchor not in s:
              raise SystemExit('Text Studio anchor missing')
          s=s.replace(anchor,css+anchor,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          for old,new in [
            ('manifest.webmanifest?v=13.22-dev22','manifest.webmanifest?v=13.22-dev23'),
            ('styles.css?v=13.22-dev22','styles.css?v=13.22-dev23'),
            ('app.js?v=13.22-dev22','app.js?v=13.22-dev23'),
            ('shape-studio-v13.22-dev22.js?v=13.22-dev22','shape-studio-v13.22-dev23.js?v=13.22-dev23'),
            ('./sw.js?v=13.22-dev22','./sw.js?v=13.22-dev23')
          ]: s=s.replace(old,new)
          for n in ('dev1','dev3','dev4','dev5','dev6'):
              s=s.replace(f'shape-studio-v13.22-{n}.js?v=13.22-dev22',f'shape-studio-v13.22-{n}.js?v=13.22-dev23')
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace('audrey-closet-v13.22-dev22','audrey-closet-v13.22-dev23')
          s=s.replace("'./shape-studio-v13.22-dev22.js'","'./shape-studio-v13.22-dev23.js'")
          p.write_text(s)
          PY

          grep -q 'shape-studio-v13.22-dev23.js?v=13.22-dev23' index.html
          grep -q 'audrey-closet-v13.22-dev23' sw.js
          grep -q '#boardTextSelectionV132011' shape-studio-v13.22-dev23.js

      - name: Commit dev23
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js shape-studio-v13.22-dev23.js
          git commit -m 'v13.22-dev23 remove Text Studio info row'
          git push origin main
