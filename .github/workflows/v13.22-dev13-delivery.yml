name: v13.22-dev13 delivery fix

on:
  push:
    paths:
      - '.github/workflows/v13.22-dev13-delivery.yml'

permissions:
  contents: write

jobs:
  deliver-dev13:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build dev13 delivery boundary
        shell: bash
        run: |
          set -euo pipefail

          cp shape-studio-v13.22-dev7.js shape-studio-v13.22-dev13.js
          sed -i '1s/v13\.22-dev12/v13.22-dev13/' shape-studio-v13.22-dev13.js

          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('manifest.webmanifest?v=13.22-dev7', 'manifest.webmanifest?v=13.22-dev13')
          s = s.replace('styles.css?v=13.22-dev7', 'styles.css?v=13.22-dev13')
          s = s.replace('app.js?v=13.22-dev7', 'app.js?v=13.22-dev13')
          for n in ('dev1','dev3','dev4','dev5','dev6'):
              s = s.replace(f'shape-studio-v13.22-{n}.js?v=13.22-dev7', f'shape-studio-v13.22-{n}.js?v=13.22-dev13')
          s = s.replace('shape-studio-v13.22-dev7.js?v=13.22-dev7', 'shape-studio-v13.22-dev13.js?v=13.22-dev13')
          s = s.replace("./sw.js?v=13.22-dev7", "./sw.js?v=13.22-dev13")
          p.write_text(s)

          p = Path('sw.js')
          s = p.read_text()
          s = s.replace("audrey-closet-v13.22-dev7", "audrey-closet-v13.22-dev13")
          s = s.replace("'./shape-studio-v13.22-dev7.js'", "'./shape-studio-v13.22-dev13.js'")
          p.write_text(s)
          PY

          grep -q 'shape-studio-v13.22-dev13.js?v=13.22-dev13' index.html
          grep -q "sw.js?v=13.22-dev13" index.html
          grep -q "audrey-closet-v13.22-dev13" sw.js
          grep -q "shape-studio-v13.22-dev13.js" sw.js

      - name: Commit delivery fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js shape-studio-v13.22-dev13.js
          git commit -m 'v13.22-dev13 refresh PWA delivery and Decorate tabs'
          git push origin main
