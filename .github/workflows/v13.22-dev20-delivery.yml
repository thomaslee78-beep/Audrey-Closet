name: v13.22-dev20 delivery

on:
  push:
    paths:
      - '.github/workflows/v13.22-dev20-delivery.yml'

permissions:
  contents: write

jobs:
  deliver-dev20:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build dev20 true Rectangle picker geometry
        shell: bash
        run: |
          set -euo pipefail
          cp shape-studio-v13.22-dev19.js shape-studio-v13.22-dev20.js
          python3 - <<'PY'
          from pathlib import Path

          p=Path('shape-studio-v13.22-dev20.js')
          s=p.read_text()
          s=s.replace('v13.22-dev19 — clearer Rectangle picker icon','v13.22-dev20 — true Rectangle picker preview geometry')

          anchor="""  function installShapeStudioLayoutV132207(){\n"""
          helper="""  function fixRectanglePreviewV132220(){\n    const btn=document.querySelector('#shapePickerStripV132217>.shape-picker-btn[data-shape-type=\"rectangle\"]');\n    if(!btn)return;\n    const svg=btn.querySelector('svg');\n    if(!svg)return;\n    const rect=svg.querySelector('rect');\n    if(!rect)return;\n    rect.setAttribute('x','5');\n    rect.setAttribute('y','22');\n    rect.setAttribute('width','90');\n    rect.setAttribute('height','56');\n  }\n\n"""
          if anchor not in s:
              raise SystemExit('layout anchor not found')
          s=s.replace(anchor,helper+anchor,1)

          old="""    consolidateShapePickerV132217();\n  }\n"""
          new="""    consolidateShapePickerV132217();\n    fixRectanglePreviewV132220();\n  }\n"""
          if old not in s:
              raise SystemExit('layout call anchor not found')
          s=s.replace(old,new,1)

          obs_old="""    consolidateShapePickerV132217();\n  });\n"""
          obs_new="""    consolidateShapePickerV132217();\n    fixRectanglePreviewV132220();\n  });\n"""
          if obs_old not in s:
              raise SystemExit('observer anchor not found')
          s=s.replace(obs_old,obs_new,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('manifest.webmanifest?v=13.22-dev19','manifest.webmanifest?v=13.22-dev20')
          s=s.replace('styles.css?v=13.22-dev19','styles.css?v=13.22-dev20')
          s=s.replace('app.js?v=13.22-dev19','app.js?v=13.22-dev20')
          for n in ('dev1','dev3','dev4','dev5','dev6'):
              s=s.replace(f'shape-studio-v13.22-{n}.js?v=13.22-dev19',f'shape-studio-v13.22-{n}.js?v=13.22-dev20')
          s=s.replace('shape-studio-v13.22-dev19.js?v=13.22-dev19','shape-studio-v13.22-dev20.js?v=13.22-dev20')
          s=s.replace('./sw.js?v=13.22-dev19','./sw.js?v=13.22-dev20')
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace('audrey-closet-v13.22-dev19','audrey-closet-v13.22-dev20')
          s=s.replace("'./shape-studio-v13.22-dev19.js'","'./shape-studio-v13.22-dev20.js'")
          p.write_text(s)
          PY

          grep -q 'shape-studio-v13.22-dev20.js?v=13.22-dev20' index.html
          grep -q 'audrey-closet-v13.22-dev20' sw.js
          grep -q 'fixRectanglePreviewV132220' shape-studio-v13.22-dev20.js
          grep -q "height','56'" shape-studio-v13.22-dev20.js

      - name: Commit dev20
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js shape-studio-v13.22-dev20.js
          git commit -m 'v13.22-dev20 fix Rectangle picker preview geometry'
          git push origin main
