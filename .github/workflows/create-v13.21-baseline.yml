name: Create v13.21 baseline

on:
  push:
    paths:
      - '.github/workflows/create-v13.21-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v13.21 baseline
        shell: python
        run: |
          from pathlib import Path

          sw = Path('sw.js')
          text = sw.read_text()
          text = text.replace("const CACHE='audrey-closet-v13.20-dev12';", "const CACHE='audrey-closet-v13.21';", 1)
          text = text.replace('v13.20-dev12 Text Studio compact layout + render fix.', 'v13.21 baseline — dev12 functionality, fresh cache.', 1)
          text = text.replace(';/* v13.20-dev12 — Text Studio compact layout + render fix */', ';/* v13.21 baseline — dev12 feature set, fresh delivery */', 1)
          text = text.replace('Version v13.20-dev10', 'Version v13.21', 1)
          sw.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('href="manifest.webmanifest"', 'href="manifest.webmanifest?v=13.21"', 1)
          html = html.replace('href="styles.css"', 'href="styles.css?v=13.21"', 1)
          html = html.replace('<script src="app.js"></script>', '<script src="app.js?v=13.21"></script>\n  <script>\n    if (\'serviceWorker\' in navigator) {\n      window.addEventListener(\'load\', function () {\n        navigator.serviceWorker.register(\'./sw.js?v=13.21\', { updateViaCache: \'none\' })\n          .then(function (registration) { return registration.update(); })\n          .catch(function (error) { console.error(\'Service worker registration failed\', error); });\n      });\n    }\n  </script>', 1)
          index.write_text(html)

      - name: Commit baseline
        run: |
          if git diff --quiet; then
            echo "v13.21 baseline already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git commit -m "Create v13.21 clean baseline from dev12"
          git push
